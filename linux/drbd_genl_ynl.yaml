    value: 31
    checks:
      max-len: SHARED_SECRET_MAX
    default: ''
  - name: csums-after-crash-only
    type: u8
    value: 33
    default: DRBD_CSUMS_AFTER_CRASH_ONLY_DEF
  - name: sock-check-timeo
    type: u32
    value: 34
    default: DRBD_SOCKET_CHECK_TIMEO_DEF
  - name: transport-name
    type: string
    value: 35
    checks:
      max-len: SHARED_SECRET_MAX
    default: ''
  - name: max-buffers
    type: u32
    value: 36
    default: DRBD_MAX_BUFFERS_DEF
  - name: allow-remote-read
    type: u8
    value: 37
    default: DRBD_ALLOW_REMOTE_READ_DEF
  - name: tls
    type: u8
    value: 38
    default: DRBD_TLS_DEF
  - name: tls-privkey
    type: s32
    value: 39
    default: DRBD_TLS_PRIVKEY_DEF
  - name: tls-certificate
    type: s32
    value: 40
    default: DRBD_TLS_CERTIFICATE_DEF
  - name: tls-keyring
    type: s32
    value: 41
    default: DRBD_TLS_KEYRING_DEF
  - name: load-balance-paths
    type: u8
    value: 42
    default: DRBD_LOAD_BALANCE_PATHS_DEF
  - name: rdma-ctrl-rcvbuf-size
