    type: u32
    value: 14
    default: DRBD_ON_SUSP_PRI_OUTD_DEF
  - name: drbd8-compat-mode
    type: u8
    value: 15
    default: DRBD_DRBD8_COMPAT_MODE_DEF
  - name: explicit-drbd8-compat
    type: u8
    value: 16
    default: DRBD_DRBD8_COMPAT_MODE_DEF
