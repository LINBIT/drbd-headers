    value: 20
    default: DRBD_RR_CONFLICT_DEF
  - name: on-congestion
    type: u32
    value: 21
    default: DRBD_ON_CONGESTION_DEF
  - name: cong-fill
    type: u32
    value: 22
    default: DRBD_CONG_FILL_DEF
  - name: cong-extents
    type: u32
    value: 23
    default: DRBD_CONG_EXTENTS_DEF
