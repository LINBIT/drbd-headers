# SPDX-License-Identifier: ((GPL-2.0 WITH Linux-syscall-note) OR BSD-3-Clause)
name: drbd
protocol: genetlink-legacy
version: 2
uapi-header: linux/drbd_genl.h
kernel-family:
  emit-structs: true
doc: 'DRBD (Distributed Replicated Block Device) genetlink protocol for

  configuring and monitoring replication resources, devices,

  connections, and peer devices.

  '
