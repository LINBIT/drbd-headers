    default: ''
  - name: cram-hmac-alg
    type: string
    value: 2
    checks:
      max-len: SHARED_SECRET_MAX
    default: ''
  - name: integrity-alg
    type: string
    value: 3
    checks:
      max-len: SHARED_SECRET_MAX
    default: ''
  - name: verify-alg
    type: string
    value: 4
    checks:
      max-len: SHARED_SECRET_MAX
    default: ''
  - name: csums-alg
    type: string
    value: 5
    checks:
      max-len: SHARED_SECRET_MAX
    default: ''
  - name: wire-protocol
    type: u32
    value: 6
    default: DRBD_PROTOCOL_DEF
  - name: connect-int
    type: u32
    value: 7
    default: DRBD_CONNECT_INT_DEF
  - name: timeout
    type: u32
    value: 8
    default: DRBD_TIMEOUT_DEF
  - name: ping-int
    type: u32
    value: 9
    default: DRBD_PING_INT_DEF
  - name: ping-timeo
    type: u32
    value: 10
    default: DRBD_PING_TIMEO_DEF
  - name: sndbuf-size
    type: u32
    value: 11
    default: DRBD_SNDBUF_SIZE_DEF
  - name: rcvbuf-size
    type: u32
    value: 12
    default: DRBD_RCVBUF_SIZE_DEF
