  - name: net-conf
    type: nest
    value: 5
    nested-attributes: net-conf
  - name: set-role-parms
    type: nest
    value: 6
    nested-attributes: set-role-parms
  - name: resize-parms
    type: nest
    value: 7
    nested-attributes: resize-parms
  - name: start-ov-parms
