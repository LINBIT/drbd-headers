    default: DRBD_RDMA_CTRL_RCVBUF_SIZE_DEF
  - name: rdma-ctrl-sndbuf-size
    type: u32
    value: 44
    default: DRBD_RDMA_CTRL_SNDBUF_SIZE_DEF
