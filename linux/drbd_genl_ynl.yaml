  - name: after-sb-0p
    type: u32
    value: 17
    default: DRBD_AFTER_SB_0P_DEF
  - name: after-sb-1p
    type: u32
    value: 18
    default: DRBD_AFTER_SB_1P_DEF
  - name: after-sb-2p
    type: u32
    value: 19
    default: DRBD_AFTER_SB_2P_DEF
  - name: rr-conflict
